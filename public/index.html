<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Store - Componentes y Accesorios</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>PC Store</h1>
    <div class="user-bar">
      <label for="userIdInput">Cliente activo:</label>
      <input type="text" id="userIdInput" value="cliente-1" />
      <button id="loadCartBtn" class="btn-secondary">Cargar Carrito</button>
    </div>
  </header>

  <main class="container">
    <!-- Columna Izquierda: Gestión y Catálogo -->
    <section class="catalog-section">
      <!-- Formulario de Creación -->
      <div class="card form-card">
        <h2>Agregar Producto al Catálogo</h2>
        <form id="productForm">
          <input type="text" id="nameInput" placeholder="Ej. RTX 4070 / Mouse G502" required />
          <input type="number" id="priceInput" placeholder="Precio (COP)" min="1" required />
          <select id="categoryInput" required>
            <option value="componentes">Componentes (GPU, RAM, CPU...)</option>
            <option value="accesorios">Accesorios (Mouse, Teclado, Diademas...)</option>
          </select>
          <button type="submit" class="btn-primary">Guardar Producto</button>
        </form>
      </div>

      <!-- Filtros por Categoría -->
      <div class="filter-bar">
        <button class="filter-btn active" data-category="">Todos</button>
        <button class="filter-btn" data-category="componentes">Componentes PC</button>
        <button class="filter-btn" data-category="accesorios">Accesorios PC</button>
      </div>

      <!-- Grid de Productos -->
      <div id="productsGrid" class="products-grid"></div>
    </section>

    <!-- Columna Derecha: Carrito de Compras -->
    <aside class="cart-section card">
      <h2>Carrito de Compras</h2>
      <div id="cartItems" class="cart-items">
        <p class="empty-msg">El carrito está vacío.</p>
      </div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <strong id="cartTotal">$0</strong>
        </div>
        <button id="clearCartBtn" class="btn-danger">Vaciar Carrito</button>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
